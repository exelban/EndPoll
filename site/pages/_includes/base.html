<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ title | escape }}</title>
    <meta name="description" content="{{ description | escape }}" />
    <meta name="author" content="{{ site.author | escape }}" />
    <meta name="theme-color" content="#F9F9F9" />
    {% if noindex %}
    <meta name="robots" content="noindex" />
    {% else %}
    <link rel="canonical" href="{{ site.url }}{{ canonicalPath | default: page.url | escape }}" />
    {% endif %}
    <meta property="og:site_name" content="{{ site.name | escape }}" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:title" content="{{ title | escape }}" />
    <meta property="og:description" content="{{ description | escape }}" />
    <meta property="og:url" content="{{ site.url }}{{ canonicalPath | default: page.url | escape }}" />
    <meta property="og:image" content="{{ site.url }}{{ site.image }}" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="{{ site.imageAlt | escape }}" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="{{ title | escape }}" />
    <meta name="twitter:description" content="{{ description | escape }}" />
    <meta name="twitter:image" content="{{ site.url }}{{ site.image }}" />
    <meta name="twitter:image:alt" content="{{ site.imageAlt | escape }}" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="stylesheet" href="/assets/css/main.css" />
    <script src="https://analytics.endpoll.com/script.js" defer data-website-id="1d1092c3-6f33-4743-8cf2-9531cf878550"></script>
    {% if script %}
    <script src="{{ script | escape }}" defer></script>
    {% endif %}
  </head>
  <body>
    <nav class="site-nav">
      <div class="nav-inner container container-wide">
        <a href="/" class="brand">
          <img src="/icon.png" alt="" width="28" height="28" class="brand-icon" />
          EndPoll
        </a>
        <div class="nav-links">
          <a href="https://app.endpoll.com" target="_blank" rel="noopener noreferrer" class="nav-link">Demo</a>
          <a href="/docs/docker" class="nav-link">Docs</a>
          <a href="https://github.com/exelban/EndPoll" target="_blank" rel="noopener noreferrer" aria-label="EndPoll on GitHub" class="nav-link">
            <svg class="icon" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/></svg>
          </a>
        </div>
      </div>
    </nav>

    <main class="site-main">
      {{ content }}
    </main>

    <footer class="site-footer">
      <div class="footer-inner container container-wide">
        <div class="footer-brand">
          <img src="/icon.png" alt="" width="20" height="20" class="icon" />
          <span>EndPoll by <a href="https://serhiy.io" target="_blank" rel="noopener noreferrer" class="author-link" title="exelban's blog">exelban</a></span>
        </div>
        <div class="footer-links">
          <a href="/docs/docker" class="footer-link">Documentation</a>
          <a href="https://github.com/exelban/EndPoll" target="_blank" rel="noopener noreferrer" class="footer-link">GitHub</a>
          <a href="https://github.com/exelban/EndPoll/blob/master/LICENSE" target="_blank" rel="noopener noreferrer" class="footer-link">MIT License</a>
        </div>
      </div>
    </footer>
  </body>
</html>
