name: Tests

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Install moq
        run: go install github.com/matryer/moq@latest

      - name: Generate mocks
        run: go generate ./...

      - name: Vet
        run: go vet ./...

      - name: Run tests
        run: go test -race ./...
